# reusable ESM — host-visible names stay
[javascript]
# Measured on this port: the objects it reads are plain data, so a member
# read is not a coercion hook and the value can nest into its consumer.
assume_pure_property_reads = true
priority = "size-first"
# 8.20 (measured, fleet sweep of four budgets with the level clamp bypassed):
# this port wants a 32 MiB candidate pool -- 2 MiB -78, 32 MiB -403 against the
# default -- and only level 15 escapes the clamp that pins the budget at 512 KiB
# for level 12. The two are declared together because neither works alone.
optimization_level = 15
cost_model = "brotli"
assume_pristine_builtins = true
strip_console = true
candidate_search = "always"
candidate_byte_budget = 33554432

[mangle]
identifiers = true
properties = true
pool_strings = true
