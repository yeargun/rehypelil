# reusable ESM — host-visible names stay
[javascript]
# Measured on this port: the objects it reads are plain data, so a member
# read is not a coercion hook and the value can nest into its consumer.
assume_pure_property_reads = true
priority = "size-first"
optimization_level = 12
cost_model = "brotli"
assume_pristine_builtins = true
strip_console = true
# 8.19 (measured, fleet sweep of five reserves): the naming reserve picks the
# basin, not the depth, and the curve is not monotone -- 8:+11, 16:+111, 32:+11, 64:-77
# against the declared 48. Re-measure it after any emitter change.
local_name_reserve = 64
candidate_search = "always"
function_spelling = "arrow"
public_aggregate_abi = "named"

[mangle]
identifiers = true
properties = true
exports = false
extern_fields = true
pool_strings = true
