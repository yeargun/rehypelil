# closed LilScript world. This compiler renames no properties, so extern keys
# keep their names here too.
[javascript]
priority = "size-first"
optimization_level = 12
cost_model = "brotli"
assume_pristine_builtins = true
strip_console = true
candidate_search = "always"

[mangle]
identifiers = true
properties = true
pool_strings = true
